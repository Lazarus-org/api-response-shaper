[tox]
requires =
    tox>=4.2
env_list =
    py313-django52-drf318
    py312-django52-drf318
    py311-django52-drf318
    py310-django52-drf318

[testenv]
description = Run pytest for a supported Python/Django/DRF compatibility point
package = editable
deps =
    pytest<9,>=8.3
    pytest-asyncio<0.26,>=0.25
    pytest-cov<6,>=5
    pytest-django<5,>=4.8
    django52: django<5.3,>=5.2
    drf318: djangorestframework<3.19,>=3.18
commands =
    pytest --cov=response_shaper --cov-report=xml

[testenv:bandit]
description = Run security checks
skip_install = true
deps =
    bandit
commands =
    bandit -r response_shaper

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files
