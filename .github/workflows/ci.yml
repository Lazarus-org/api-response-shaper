name: CI

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.tox-env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            tox-env: py310-django52-drf318
          - python-version: '3.11'
            tox-env: py311-django52-drf318
          - python-version: '3.12'
            tox-env: py312-django52-drf318
          - python-version: '3.12'
            tox-env: py312-django60-drf318
          - python-version: '3.12'
            tox-env: py312-django61-drf318
          - python-version: '3.13'
            tox-env: py313-django52-drf318
          - python-version: '3.13'
            tox-env: py313-django60-drf318
          - python-version: '3.13'
            tox-env: py313-django61-drf318
          - python-version: '3.14'
            tox-env: py314-django52-drf318
          - python-version: '3.14'
            tox-env: py314-django60-drf318
          - python-version: '3.14'
            tox-env: py314-django61-drf318

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.9"
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --locked --dev

      - name: Run compatibility tests
        run: uv run tox -e ${{ matrix.tox-env }}

  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v9
        with:
          python-version: '3.14'
          version: "0.12.9"
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=response_shaper --cov-report=xml

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --config=.pre-commit-config-ci.yaml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
