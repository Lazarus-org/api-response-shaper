name: CI

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.tox-env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            tox-env: py310-django52-drf318
          - python-version: '3.11'
            tox-env: py311-django52-drf318
          - python-version: '3.12'
            tox-env: py312-django52-drf318
          - python-version: '3.12'
            tox-env: py312-django60-drf318
          - python-version: '3.12'
            tox-env: py312-django61-drf318
          - python-version: '3.13'
            tox-env: py313-django52-drf318
          - python-version: '3.13'
            tox-env: py313-django60-drf318
          - python-version: '3.13'
            tox-env: py313-django61-drf318
          - python-version: '3.14'
            tox-env: py314-django52-drf318
          - python-version: '3.14'
            tox-env: py314-django60-drf318
          - python-version: '3.14'
            tox-env: py314-django61-drf318

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install --upgrade pip "tox>=4.16,<5"

      - name: Run compatibility tests
        run: tox -e ${{ matrix.tox-env }}

  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pytest>=8.3,<9" "pytest-asyncio>=0.25,<0.26" "pytest-cov>=5,<6" "pytest-django>=4.8,<5" "pre-commit>=3.5,<4"

      - name: Run tests with coverage
        run: pytest --cov=response_shaper --cov-report=xml

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --config=.pre-commit-config-ci.yaml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
